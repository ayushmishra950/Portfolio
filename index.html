<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aayush Mishra — Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Aayush Mishra, Full Stack Developer from Jaipur with 1.5+ years of experience in React.js, React Native Expo, TypeScript, Node.js, Express.js and MongoDB."
    />
    <meta name="author" content="Aayush Mishra" />
    <meta property="og:title" content="Aayush Mishra — Full Stack Developer" />
    <meta
      property="og:description"
      content="Enterprise web apps, social platforms and mobile apps built with React, React Native, Node.js and MongoDB."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#07090f" />
    <link rel="icon" type="image/svg+xml" href="/logo-am.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
